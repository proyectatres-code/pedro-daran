    /* ===== Reset & Vars ===== */
    * { margin: 0; padding: 0; box-sizing: border-box }
:root {
  --bg: #071526;
  --card: rgba(255, 255, 255, 0.07);
  --ink: #f0f6ff;
  --accent: #00c8e8;
  --accent2: #0a84d4;
  --gold: #c9a84c;
  --divider: linear-gradient(
    180deg,
    rgba(0, 200, 232, 0.20),
    rgba(0, 0, 0, 0.50),
    rgba(10, 132, 212, 0.15)
  );
  --link: #00c8e8;
  --link-hover: #0a84d4;
}
html, body { min-height: 100% }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
               'Helvetica Neue', Arial, sans-serif;

    145deg,
    #071526 0%,
    #0b2240 35%,
    #0d2d52 60%,

  );
  color: #f0f6ff;
  overflow-x: hidden;
  font-size: 18px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

    /* ===== Splash (animación suave) ===== */
    #splash{
      position:fixed; inset:0; z-index:9999;
      display:flex; align-items:center; justify-content:center;
      background:url('https://i.postimg.cc/SRcNmMTB/fondo-logod.png') center/cover no-repeat;
      animation:fadeOut .5s ease-in-out 2.5s forwards;
      will-change: opacity, visibility;
      contain: content;
    }
    #splash-logo{
      display:flex; align-items:center; justify-content:center;
      opacity:0; transform:translateZ(0) scale(.72);
      will-change: transform, opacity;
      animation:logoAppear 1s ease-out .2s forwards;
    }
    /* LOGO más grande en móvil, sin distorsión */
    #splash-logo img{
      max-width:92vw;
      max-height:55vh;
      object-fit:contain;
    }
    @media (min-width:768px){
      #splash-logo img{ max-width:42vw; max-height:50vh; }
    }
    @keyframes logoAppear{
      0%   { opacity:0; transform:translateZ(0) scale(.72); }
      60%  { opacity:1; transform:translateZ(0) scale(1.06); }
      85%  { opacity:1; transform:translateZ(0) scale(.995); }
      100% { opacity:1; transform:translateZ(0) scale(1); }
    }
    @keyframes fadeOut{ to{ opacity:0; visibility:hidden; } }
    #app{ opacity:0; animation:appFadeIn .5s ease-in-out 2.8s forwards; }
    @keyframes appFadeIn{ to{ opacity:1; } }

    @media (prefers-reduced-motion: reduce){
      #splash, #splash-logo, #app{ animation:none !important; }
      #splash-logo{ opacity:1; transform:none; }
      #app{ opacity:1; }
    }

    /* ===== Header ===== */
    .header{
      background:linear-gradient(135deg,#134aa7 0%,#0a243f 100%);
      padding:40px 20px; text-align:center; box-shadow:0 4px 6px rgba(0,0,0,.1);
    }
    .profile-photo{
      width:150px;height:150px;border-radius:50%;background:#e0e0e0;margin:0 auto 20px;
      overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.2);border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
    }
    .profile-photo img{width:100%;height:100%;object-fit:cover;object-position:center}

    .name{
      color:#fff;
      font-size:clamp(24px,5vw,32px);
      line-height:1.15;
      margin-bottom:8px;
      font-weight:700;
      letter-spacing:-0.2px;
    }
    .title{
      color:rgba(255,255,255,.92);
      font-size:clamp(14px,2.6vw,18px);
      margin-bottom:22px;
      font-weight:500;
    }

    /* ===== Botonera superior ===== */
    .action-wrap{padding:0 16px}
    .action-buttons{
      position:relative;display:flex;align-items:stretch;gap:0;
      max-width:520px;margin:0 auto;background:var(--card);border-radius:18px;padding:6px;
      box-shadow:0 10px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(0,0,0,.16);
      backdrop-filter:blur(2px);overflow:hidden
    }
    .divider{width:1px;margin:6px 6px;background:var(--divider);opacity:.9;pointer-events:none}
    .action-btn{
      flex:1 1 0;border:0;cursor:pointer;background:transparent;color:var(--ink);
      padding:clamp(10px,3vw,14px) 10px;border-radius:12px;
      font-size:clamp(12px,3.2vw,14px);font-weight:800;text-transform:uppercase;
      display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
      min-height:46px;transition:box-shadow .15s ease,background .15s ease,transform .05s ease
    }
    .action-btn svg{width:18px;height:18px;fill:currentColor}
    .action-btn:hover{background:rgba(255,255,255,.10)}
    .action-btn:active{transform:translateY(1px);background:rgba(255,255,255,.12)}
    .action-btn--white{color:#fff;text-decoration:none}

    .icon-btn{flex:0 0 auto;width:46px;height:46px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center}
    .icon-btn svg{width:20px;height:20px}

    @media (max-width:360px){
      .action-buttons{max-width:100%}
      .action-btn{font-size:11.5px;padding:9px 8px;min-height:44px}
      .icon-btn{width:44px;height:44px}
    }

    /* ===== Tarjeta de contacto ===== */
    .contact-info{
      background:#fff;margin:20px;border-radius:16px;padding:24px;
      box-shadow:0 8px 32px rgba(0,0,0,.1)
    }
    .contact-item{display:flex;align-items:flex-start;gap:15px;padding:14px 0;border-bottom:1px solid #f0f0f0;transition:background .25s ease}
    .contact-item:last-child{border-bottom:none}
    .contact-item:hover{background:#f8f9fa;border-radius:8px}
    .contact-icon{
      width:42px;height:42px;background:#f0f7ff;border-radius:50%;
      display:flex;align-items:center;justify-content:center;color:#0f3156;flex:0 0 42px;margin-top:2px
    }
    .contact-details h3{
      font-size:clamp(14px,3vw,18px);
      color:#666;margin-bottom:4px;text-transform:uppercase;
      font-weight:400;
      letter-spacing:.4px;
    }
    .contact-details p{
      font-size:clamp(15px,3.4vw,17px);

    }

    /* ===== Redes ===== */
    .social-section{

    .social-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;min-height:80px;border:2px solid #f0f0f0;border-radius:10px;text-decoration:none;color:#666;background:#fafafa;transition:all .15s ease}
    .social-btn:hover{border-color:#e0e0e0;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);background:#fff}
    .social-btn img{width:clamp(26px,5vw,34px);height:clamp(26px,5vw,34px);margin-bottom:6px}
    .social-btn span{font-size:clamp(9px,2.2vw,10px);letter-spacing:.5px;text-transform:uppercase;font-weight:700}

    /* ===== Toast ===== */
    .toast{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);
      background:#333;color:#fff;padding:12px 24px;border-radius:25px;font-size:14px;z-index:1000;transition:transform .3s ease
    }
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>

  <script>
    /* Toast pequeño reutilizable */
    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
      return true;
    }

    /* Compartir: usa siempre la ruta limpia /r */
    function shareCard(){
      const url = 'https://adaran.vercel.app/r';
      const shareData = { title: document.title, text: document.title, url };

      if (navigator.share) {
        navigator.share(shareData)
          .then(() => showToast('Enlace compartido exitosamente'))
          .catch(() => {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(() => showToast('Enlace copiado al portapapeles'))
          .catch(() => alert('Copia este enlace: ' + url));
      } else {
        alert('Copia este enlace: ' + url);
      }
    }
  </script>
